[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pathlens-gnn"
version = "0.2.0"
description = "Leakage-safe comparative DTI ranking on BioSNAP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Amirreza Nemati" }]
dependencies = [
  "numpy>=2.0,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
]

[project.scripts]
pathlens = "pathlens.runtime.cli:main"

[project.optional-dependencies]
train = ["torch>=2.7,<3"]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pathlens"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
cache_dir = ".cache/pytest"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pathlens"]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "yaml", "torch"]
ignore_missing_imports = true
