[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pathlens-gnn"
version = "0.1.0"
description = "Leakage-aware path-aware graph learning for transductive drug-target interaction ranking"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Amirreza Nemati" }]
dependencies = [
  "numpy>=2.0,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
train = ["torch>=2.7,<3"]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
pathlens = "pathlens_gnn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pathlens_gnn"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pathlens_gnn"]

[[tool.mypy.overrides]]
module = ["pathlens_gnn.model.*", "pathlens_gnn.training.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pathlens_gnn"]
