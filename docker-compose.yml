services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PATHLENS_ARTIFACT_DIR: /app/artifacts/current
      PATHLENS_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
