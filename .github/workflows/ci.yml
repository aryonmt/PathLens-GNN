name: CI

on:
  pull_request:
  push:
    branches: [main, planning, research/ranking-loss]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src tests methods
      - run: uv run mypy src
      - run: uv run pytest --cov=pathlens --cov-report=term-missing
